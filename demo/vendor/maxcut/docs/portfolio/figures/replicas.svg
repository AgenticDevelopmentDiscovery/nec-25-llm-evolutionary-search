="55" y="330" font-size="17" fill="#163449" font-family="DejaVu Sans, sans-serif">No inter-replica force</text><text x="460" y="350" font-size="14" fill="#163449" font-family="DejaVu Sans, sans-serif">J_perp(t) = -log(tanh(beta*Gamma/R))/(2 beta)</text><text x="24" y="398" font-size="14" fill="#163449" font-family="DejaVu Sans, sans-serif">Conceptual; ring neighbors are columns for the SAME graph node.</text></svg>