<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#647786"/></marker></defs><rect width="900" height="430" fill="#f7fafc"/><text x="24" y="35" font-size="22" fill="#163449" font-family="DejaVu Sans, sans-serif">Tabu memory and strict aspiration</text><text x="24" y="62" font-size="13" fill="#163449" font-family="DejaVu Sans, sans-serif">CONCEPTUAL illustration / exact small arithmetic</text><text x="50" y="125" font-size="19" fill="#163449" font-family="DejaVu Sans, sans-serif">Flip A at iteration t; tenure = 2 iterations</text><rect x="45" y="180" width="200" height="70" rx="8" fill="white" stroke="#176b91"/><text x="55" y="220" font-size="16" fill="#176b91" font-family="DejaVu Sans, sans-serif">t: A flips</text><rect x="260" y="180" width="200" height="70" rx="8" fill="white" stroke="#c94f35"/><text x="270" y="220" font-size="16" fill="#c94f35" font-family="DejaVu Sans, sans-serif">t+1: A tabu</text><rect x="475" y="180" width="200" height="70" rx="8" fill="white" stroke="#c94f35"/><text x="485" y="220" font-size="16" fill="#c94f35" font-family="DejaVu Sans, sans-serif">t+2: A tabu</text><rect x="690" y="180" width="200" height="70" rx="8" fill="white" stroke="#278353"/><text x="700" y="220" font-size="16" fill="#278353" font-family="DejaVu Sans, sans-serif">t+3: A eligible</text><text x="50" y="305" font-size="17" fill="#163449" font-family="DejaVu Sans, sans-serif">Aspiration permits an earlier move only if it beats the global best.</text><text x="24" y="398" font-size="14" fill="#163449" font-family="DejaVu Sans, sans-serif">Conceptual tenure-two example; actual default tenure is 20.</text></svg>