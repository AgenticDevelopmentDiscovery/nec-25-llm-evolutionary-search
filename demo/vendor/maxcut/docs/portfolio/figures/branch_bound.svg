<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#647786"/></marker></defs><rect width="900" height="430" fill="#f7fafc"/><text x="24" y="35" font-size="22" fill="#163449" font-family="DejaVu Sans, sans-serif">Why a valid upper bound permits pruning</text><text x="24" y="62" font-size="13" fill="#163449" font-family="DejaVu Sans, sans-serif">CONCEPTUAL illustration / exact small arithmetic</text><circle cx="440" cy="115" r="23" fill="#176b91"/><text x="425" y="121" font-size="16" fill="white" font-family="DejaVu Sans, sans-serif">root</text><text x="485" y="120" font-size="16" fill="#163449" font-family="DejaVu Sans, sans-serif">U = 14.0 (sum of positive weights)</text><line x1="425" y1="138" x2="250" y2="205" stroke="#647786" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="455" y1="138" x2="640" y2="205" stroke="#647786" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="230" cy="235" r="23" fill="#176b91"/><text x="215" y="241" font-size="16" fill="white" font-family="DejaVu Sans, sans-serif">B+</text><circle cx="660" cy="235" r="23" fill="#278353"/><text x="645" y="241" font-size="16" fill="white" font-family="DejaVu Sans, sans-serif">B-</text><text x="100" y="295" font-size="16" fill="#163449" font-family="DejaVu Sans, sans-serif">A=B: conditional maximum 8</text><text x="510" y="295" font-size="16" fill="#163449" font-family="DejaVu Sans, sans-serif">A differs B: conditional maximum 10</text><text x="100" y="350" font-size="18" fill="#163449" font-family="DejaVu Sans, sans-serif">Once incumbent = 10, any branch with U &lt;= 10 can be pruned.</text><text x="24" y="398" font-size="14" fill="#163449" font-family="DejaVu Sans, sans-serif">Conceptual trap branches; conditional bounds obtained by complete tiny enumeration.</text></svg>