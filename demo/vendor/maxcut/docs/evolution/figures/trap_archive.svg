<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Archive preserves the best cut during exploration">
<title>Archive preserves the best cut during exploration</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#40536b"/></marker></defs>
<rect width="960" height="440" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#18283c"><text x="30" y="36" font-size="24" font-weight="bold">Archive preserves the best cut during exploration</text><text x="40" y="78">Actual fixture-test observations; discrete checkpoints, not runtime samples</text><path d="M100,325 H850" stroke="#d8dfeb"/><text x="67" y="331">7</text><path d="M100,260 H850" stroke="#d8dfeb"/><text x="67" y="266">8</text><path d="M100,195 H850" stroke="#d8dfeb"/><text x="67" y="201">9</text><path d="M100,130 H850" stroke="#d8dfeb"/><text x="67" y="136">10</text><polyline points="170,260.0 470,260.0 770,130.0" fill="none" stroke="#147647" stroke-width="5"/><polyline points="170,260.0 470,325.0 770,130.0" fill="none" stroke="#b85c0d" stroke-width="3" stroke-dasharray="9 6"/><circle cx="170" cy="260.0" r="6" fill="#b85c0d"/><text x="105" y="363">Frozen parent</text><circle cx="470" cy="325.0" r="6" fill="#b85c0d"/><text x="405" y="363">After perturbation</text><circle cx="770" cy="130.0" r="6" fill="#b85c0d"/><text x="705" y="363">After refinement</text><text x="110" y="405" fill="#147647">Solid: saved archive (8, 8, 10)</text><text x="500" y="405" fill="#b85c0d">Dashed: working cut (8, 7, 10)</text></g></svg>