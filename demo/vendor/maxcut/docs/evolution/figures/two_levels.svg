<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="Two levels of mutation">
<title>Two levels of mutation</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#40536b"/></marker></defs>
<rect width="960" height="410" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#18283c"><text x="30" y="36" font-size="24" font-weight="bold">Two levels of mutation</text><rect x="30" y="80" width="390" height="74" rx="12" stroke="#526d91" fill="#e8f0fc"/><text x="45" y="108">Codex proposes an inherited recipe</text><text x="45" y="132">Code / config / policy / stages</text><rect x="535" y="80" width="390" height="74" rx="12" stroke="#526d91" fill="#e8f0fc"/><text x="550" y="108">Controller admits and measures</text><text x="550" y="132">Source scope + checks + budgets</text><path d="M425,118 L525,118" stroke="#40536b" stroke-width="2" fill="none"/><polygon points="525,118 514.0,113.0 514.0,123.0" fill="#40536b"/><rect x="30" y="225" width="260" height="74" rx="12" stroke="#526d91" fill="#e8f0fc"/><text x="45" y="253">Frozen assignment</text><text x="45" y="277">Owned copied signs</text><rect x="350" y="225" width="260" height="74" rx="12" stroke="#526d91" fill="#fff1df"/><text x="365" y="253">Numerical perturbation</text><text x="365" y="277">Signs or BM angles</text><rect x="670" y="225" width="260" height="74" rx="12" stroke="#526d91" fill="#e4f5ea"/><text x="685" y="253">Supported refinement</text><text x="685" y="277">Verified assignment</text><path d="M295,262 L340,262" stroke="#40536b" stroke-width="2" fill="none"/><polygon points="340,262 329.0,257.0 329.0,267.0" fill="#40536b"/><path d="M615,262 L660,262" stroke="#40536b" stroke-width="2" fill="none"/><polygon points="660,262 649.0,257.0 649.0,267.0" fill="#40536b"/><text x="32" y="380">Conceptual architecture: changing a state alone does not evolve an implementation.</text></g></svg>